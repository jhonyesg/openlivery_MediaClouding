<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Mediaclouding mark — gato bicolor (versión simplificada)
       Una silueta de gato blanco con ojos heterocromos
       (teal + amarillo) y orejas bicolor (teal + amarillo).
       Funciona de 16px (favicon) a 1024px. -->

  <!-- Fondo: cuadrado redondeado teal -->
  <rect width="100" height="100" rx="22" ry="22" fill="#04b5bc"/>

  <!-- Antena/señal broadcast arriba (ref al medio) -->
  <line x1="50" y1="10" x2="50" y2="18" stroke="#f6cf32" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="8" r="2.5" fill="#f6cf32"/>

  <!-- Cabeza del gato (silueta blanca) -->
  <!-- Orejas triangulares -->
  <path d="M 22 38 L 34 26 L 36 50 Z" fill="#027377"/>
  <path d="M 78 38 L 66 26 L 64 50 Z" fill="#f6cf32"/>

  <!-- Cara blanca principal -->
  <ellipse cx="50" cy="56" rx="30" ry="28" fill="white"/>

  <!-- Ojos heterocromos (teal + amarillo = bicolor) -->
  <circle cx="40" cy="54" r="4" fill="#027377"/>
  <circle cx="60" cy="54" r="4" fill="#f6cf32"/>

  <!-- Brillos en los ojos -->
  <circle cx="41" cy="52" r="1.2" fill="white"/>
  <circle cx="61" cy="52" r="1.2" fill="white"/>

  <!-- Nariz pequeña -->
  <path d="M 47 64 L 53 64 L 50 68 Z" fill="#bd2035"/>

  <!-- Boca en W (sonrisa) -->
  <path d="M 50 68 Q 46 73 43 71" stroke="#027377" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 50 68 Q 54 73 57 71" stroke="#027377" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Bigotes (líneas finas blancas) -->
  <line x1="30" y1="64" x2="22" y2="62" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="30" y1="68" x2="22" y2="68" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="70" y1="64" x2="78" y2="62" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="70" y1="68" x2="78" y2="68" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
</svg>
